  - "本期明确跳过 Tailwind 等原子类 CSS 框架，恪守纯原生 CSS 变量系统"
  - "本期明确跳过商业字体 Matisse EB，全站标题卡统一采用开源免费的思源宋体 Heavy/Black"
  - "本期明确跳过自建评论管理系统，评论完全委托给 Giscus (GitHub Discussions)"
